<style id="sap-infographic-motion">
@keyframes sap-line-flow{to{stroke-dashoffset:-60}}
@keyframes sap-orbit{to{transform:rotate(360deg)}}
@keyframes sap-node-glow{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}
@keyframes sap-packet{0%{opacity:0;transform:translateY(20px)}20%,75%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@media(prefers-reduced-motion:no-preference){
