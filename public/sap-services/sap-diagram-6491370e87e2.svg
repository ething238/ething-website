circle[stroke-dasharray]{transform-box:fill-box;transform-origin:center;animation:sap-orbit 90s linear infinite}
g[fill="#287F79"] circle{transform-box:fill-box;transform-origin:center;animation:sap-node-glow 4s ease-in-out infinite}
.sap-packet{animation:sap-packet 3s linear infinite}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
